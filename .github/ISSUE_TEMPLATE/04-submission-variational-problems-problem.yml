name: 🌀 Variational problems submission (new problem)
description: Submit a problem and solution to the variational problems tracker
labels: ['path: variational-problems', 'submission', 'problem submission']
body:
  - type: markdown
    attributes:
      value: |
        # Problem description and hamiltonian

        Please provide detailed information about your problem below.

        > **Is your problem already listed in the tracker?** If so, use the [existing problem submission template](https://github.com/quantum-advantage-tracker/quantum-advantage-tracker.github.io/issues/new?template=03-submission-variational-problems.yml) instead.

  - type: input
    id: hamiltonian
    attributes:
      label: Hamiltonian ID
      description: The hamiltonian instance identifier
      placeholder: my_new_model_60x2000
    validations:
      required: true

  - type: upload
    id: problemFiles
    attributes:
      label: Upload hamiltonian
      description: GitHub does not allow uploading `.fcidump` files directly. Please convert your hamiltonian file to a `.zip` archive before uploading.
    validations:
      required: true

  - type: dropdown
    id: problemCategory
    attributes:
      label: Problem category
      description: |
        - **Active candidates**: Problem instances where quantum computations currently appear to challenge leading classical methods, and where further benchmarking is needed to determine whether an advantage exists.
        - **Superseded candidates**: Problem instances where quantum computations once appeared to challenge leading classical methods, but for which subsequent classical progress has closed or reversed the apparent gap.
        - **Baseline benchmarks**: Problem instances that provide useful reference points for comparing quantum and classical methods, including examples where the state-of-the-art solutions are classical.
      options:
        - Active candidates
        - Superseded candidates
        - Baseline benchmarks
    validations:
      required: true

  - type: textarea
    id: problemDescription
    attributes:
      label: Problem description
      description: At least 1 page write-up including the problem statement, a short abstract, summary of methods used and at least one figure illustrating the main result (for instance, graphical comparison of quantum and classical solutions).
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        # Solution

        Please provide detailed information about your submission below.

  - type: input
    id: name
    attributes:
      label: Name
      description: Please provide a unique and identifiable name for your submission
    validations:
      required: true

  - type: input
    id: qubits
    attributes:
      label: Qubits
      description: Number of qubits
      placeholder: e.g., "49"
    validations:
      required: false

  - type: input
    id: gates
    attributes:
      label: Gates
      description: Number of gates
      placeholder: e.g., "648"
    validations:
      required: false

  - type: input
    id: energy
    attributes:
      label: Energy (Eh)
      description: The ground-state energy value (upper bound), measured in Eh.
      placeholder: e.g., "-7.8823"
    validations:
      required: true

  - type: input
    id: errorBoundLow
    attributes:
      label: Low error bound (Eh)
      description: Lower error bound, measured in Eh
      placeholder: e.g., "-0.05"
    validations:
      required: false

  - type: input
    id: errorBoundHigh
    attributes:
      label: High error bound (Eh)
      description: Upper error bound, measured in Eh
      placeholder: e.g., "+0.05"
    validations:
      required: false

  - type: input
    id: method
    attributes:
      label: Method
      description: Name for the method used in submission
      placeholder: e.g., "SQD"
    validations:
      required: true

  - type: textarea
    id: methodProof
    attributes:
      label: Method proof
      description: Link to paper, code repository, or detailed explanation of the method (required for verification)
      placeholder: |
        Provide at least one of:
        - Paper/preprint: https://arxiv.org/abs/...
        - Code repository: https://github.com/...
        - Method explanation: Detailed description of the approach
    validations:
      required: true

  - type: input
    id: runtimeQuantum
    attributes:
      label: Quantum runtime (seconds)
      description: Quantum execution time in seconds
      placeholder: e.g., "5"
    validations:
      required: false

  - type: input
    id: runtimeClassical
    attributes:
      label: Classical runtime (seconds)
      description: Classical computation time in seconds
      placeholder: e.g., "9000"
    validations:
      required: false

  - type: input
    id: computeResourcesQuantum
    attributes:
      label: Compute resources (quantum)
      description: Quantum hardware specification
      placeholder: e.g., "IBM Heron r2"
    validations:
      required: false

  - type: input
    id: computeResourcesClassical
    attributes:
      label: Compute resources (classical)
      description: Classical hardware specification
      placeholder: e.g., "AMD EPYC 7763, 128 cores"
    validations:
      required: false

  - type: input
    id: notes
    attributes:
      label: Notes
      description: Additional notes. Please keep to 60 characters
    validations:
      required: false

  - type: input
    id: authors
    attributes:
      label: Authors
      description: The author(s) or individual(s) involved in the submission, separated by commas
    validations:
      required: false

  - type: input
    id: institutions
    attributes:
      label: Institutions
      description: The institution(s) or organization(s) involved in the submission, separated by commas
    validations:
      required: true
